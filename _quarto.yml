project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll

lang: pt-BR

book:
  title: "Minicurso TRIGRS"
  subtitle: "Mapeamento de estabilidade de encostas deflagradas por chuva — do zero à aplicação"
  author:
    - "Érico de Castro Borges (mestrando — Programa de Mestrado Profissional em Defesa e Segurança Civil/UFF)"
    - "Cássio Guilherme Rampinelli, PhD (co-orientador)"
    - "Prof. Marcos Barreto de Mendonça, PhD (orientador)"
    - "Saulo Aires de Souza, PhD (colaborador)"
  date: today
  date-format: "DD/MM/YYYY"
  repo-url: https://github.com/sedec-dpm-cgnat/tutorial-trigrs
  repo-actions: [edit, issue]
  sidebar:
    logo: logos/DPM-Circular.png
    search: true
  page-footer:
    left: "DPM · Secretaria Nacional de Proteção e Defesa Civil · MIDR"
    right: "Feito com [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - 01-teoria.qmd
    - 02-instalacao.qmd
    - 03-compilacao.qmd
    - 04-exemplo.qmd
    - 05-rodada-e-resultados.qmd
  appendices:
    - 90-erros-comuns.qmd
    - 91-como-contribuir.qmd
    - referencias.qmd

format:
  html:
    theme: flatly
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    fig-align: center

execute:
  warning: false
  message: false
